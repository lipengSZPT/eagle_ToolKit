    function eagle_net() {
      path = overlays[overlays.length - 1].getPath();
      /* ---------- 工具：经纬度 ↔ Web Mercator ---------- */
      const RAD = Math.PI / 180;
      const R = 6378137;
      function lngLatToM(lng, lat) {
        const x = R * lng * RAD;
        const y = R * Math.log(Math.tan((90 + lat) * RAD / 2));
        return [x, y];
      }
      function mToLngLat(mx, my) {
        const lng = (mx / R) / RAD;
        const lat = (2 * Math.atan(Math.exp(my / R)) - Math.PI / 2) / RAD;
        return [lng, lat];
      }
      /* ---------- 主函数 ---------- */
      function splitGrid() {
        // 读取四角		
        pts = []
        for (var i = 0; i < path.length; i++) {
          console.log(path[i].lat);
          console.log(path[i].lng);
          temp = [path[i].lng, path[i].lat]
          pts.push(temp)
        }
        console.log(pts)
        // 转米制坐标
        const mPts = pts.map(p => lngLatToM(p[0], p[1]));
        const xs = mPts.map(p => p[0]), ys = mPts.map(p => p[1]);
        const [minX, maxX] = [Math.min(...xs), Math.max(...xs)];
        const [minY, maxY] = [Math.min(...ys), Math.max(...ys)];
        const stepX = +document.getElementById('zoneLen').value;
        const stepY = +document.getElementById('zoneWid').value;; // 500 m
        const grids = [];
        for (let x = minX; x < maxX - 1e-6; x += stepX) {
          for (let y = minY; y < maxY - 1e-6; y += stepY) {
            const x2 = Math.min(x + stepX, maxX);
            const y2 = Math.min(y + stepY, maxY);
            const sw = mToLngLat(x, y);   // 左下
            const se = mToLngLat(x2, y);   // 右下
            const ne = mToLngLat(x2, y2);  // 右上
            const nw = mToLngLat(x, y2);  // 左上
            grids.push({
              id: grids.length + 1,
              corners: [nw, ne, se, sw]  // 顺时针
            });
            overlays_split_grid.push({
              id: overlays_split_grid.length + 1,
              corners: [nw, ne, se, sw]  // 顺时针
            });
          }
        }
        console.log(grids)
        // 输出
        //document.getElementById('result').value = JSON.stringify(grids, null, 2);
        for (var i = 0; i < grids.length; i++) {
          console.log(grids[i]['corners'][0])
          console.log(grids[i]['corners'][1])
          console.log(grids[i]['corners'][2])
          console.log(grids[i]['corners'][3])
          var nw = new BMap.Point(grids[i]['corners'][0][0], grids[i]['corners'][0][1]),
            ne = new BMap.Point(grids[i]['corners'][1][0], grids[i]['corners'][1][1]),
            se = new BMap.Point(grids[i]['corners'][2][0], grids[i]['corners'][2][1]),
            sw = new BMap.Point(grids[i]['corners'][3][0], grids[i]['corners'][3][1]);
          var points = [nw, ne, se, sw];
          var curve = new BMap.Polygon(points, { strokeColor: "blue", strokeWeight: 3, strokeOpacity: 0.5 }); //创建弧线对象
          curve.addEventListener("click", function (e) {
            eagle_snake_click(this);
            console.log(this)
          })
          map.addOverlay(curve); //添加到地图中
          overlays.push(curve);
          overlays_split.push(curve);
        }
      }
      splitGrid();
      drawingManager.close()
    }
    function eagle_snake_click(e) {
      console.log(e)
      path = e.getPath();
      /* ---------- 工具：经纬度 ↔ Web Mercator ---------- */
      const RAD = Math.PI / 180;
      const R = 6378137;
      function lngLatToM(lng, lat) {
        const x = R * lng * RAD;
        const y = R * Math.log(Math.tan((90 + lat) * RAD / 2));
        return [x, y];
      }
      function mToLngLat(mx, my) {
        const lng = (mx / R) / RAD;
        const lat = (2 * Math.atan(Math.exp(my / R)) - Math.PI / 2) / RAD;
        return [lng, lat];
      }
      /* ---------- 主函数 ---------- */
      function buildSnakeRoute() {
        /* 1. 读取四角 */
        pts = []
        for (var i = 0; i < path.length; i++) {
          temp = [path[i].lng, path[i].lat]
          pts.push(temp)
        }
        const mPts = pts.map(p => lngLatToM(p[0], p[1]));
        const xs = mPts.map(p => p[0]), ys = mPts.map(p => p[1]);
        const [minX, maxX] = [Math.min(...xs), Math.max(...xs)];
        const [minY, maxY] = [Math.min(...ys), Math.max(...ys)];
        const step = +document.getElementById('routeGap').value; // 航线间距
        const width = maxX - minX;
        const height = maxY - minY;
        /* 判断长边：沿长边往返，短边步进 */
        const alongX = width >= height;
        const longLen = alongX ? width : height;
        const shortLen = alongX ? height : width;
        /* ---------- 2. 计算短边方向(步进方向)的线 ---------- */
        const shortLines = [];
        for (let s = 0; s <= shortLen + 1e-6; s += step) {
          shortLines.push(Math.min(s, shortLen));
        }
        if (shortLines[shortLines.length - 1] < shortLen - 1e-6) {
          shortLines.push(shortLen); // 强制补到最后一条边界
        }
        /* ---------- 3. 计算长边方向(往返方向)的点 ---------- */
        const longPoints = [];
        for (let l = 0; l <= longLen + 1e-6; l += step) {
          longPoints.push(Math.min(l, longLen));
        }
        if (longPoints[longPoints.length - 1] < longLen - 1e-6) {
          longPoints.push(longLen);
        }
        /* ---------- 4. 蛇形遍历 ---------- */
        const route = [];
        shortLines.forEach((s, idx) => {
          const forward = idx % 2 === 0;
          const iter = forward ? longPoints : longPoints.slice().reverse();
          iter.forEach(l => {
            const x = alongX ? (minX + l) : (minX + s);
            const y = alongX ? (minY + s) : (minY + l);
            const [lng, lat] = mToLngLat(x, y);
            route.push(new BMap.Point(lng, lat));
            //route.push([lng, lat]);
          });
        });
        console.log('route')
        console.log(route)
        /* 3. 输出 */
        //document.getElementById('result').value = JSON.stringify(route, null, 2);
        var curve = new BMap.Polyline(route, { strokeColor: "yellow", strokeWeight: 3, strokeOpacity: 0.5 });
        map.addOverlay(curve); //添加到地图中
        overlays.push(curve)
      }
      buildSnakeRoute()
    }
    function eagle_snake() {

        }

        }

        }
        if (longPoints[longPoints.length - 1] < longLen - 1e-6) {

        /* ---------- 4. 蛇形遍历 ---------- */
        const route = [];

        map.addOverlay(curve); //添加到地图中

    }
    function eagle_fenqu() {
      path = overlays[overlays.length - 1].getPath();

      const RAD = Math.PI / 180;
      const R = 6378137;

      function lngLatToM(lng, lat) {
        const x = R * lng * RAD;
        const y = R * Math.log(Math.tan((90 + lat) * RAD / 2));
        return [x, y];
      }

      function calcSide() {
        /* 1. 读取四角并转米制坐标 */
        pts = []
        for (var i = 0; i < path.length; i++) {
          temp = [path[i].lng, path[i].lat]
          pts.push(temp)
        }

        const mPts = pts.map(p => lngLatToM(p[0], p[1]));
        const xs = mPts.map(p => p[0]), ys = mPts.map(p => p[1]);
        const width = Math.max(...xs) - Math.min(...xs);
        const height = Math.max(...ys) - Math.min(...ys);

        /* 2. 能包住原矩形的最小正方形边长 */
        const rectSide = Math.max(width, height);

        /* 3. 计算网格 */
        const N = +document.getElementById('planeCount').value;
        const maxArea = 200_000;          // ≤ 200 000 m²
        const maxSide = Math.sqrt(maxArea);

        /* 4. 实际边长：保证总格数 ≥ N 且正方形边长 ≤ maxSide */
        const cols = Math.ceil(Math.sqrt(N));
        const gridSide = Math.min(maxSide, rectSide / cols);

        /* 5. 输出 */
        document.getElementById("zoneLen").value = gridSide.toFixed(2);

        document.getElementById("zoneWid").value = gridSide.toFixed(2);
        //document.getElementById('num').value = 123;
        console.log(`单个正方形子区边长（长 = 宽）：${gridSide.toFixed(2)} 米\n` +
          `子区面积：${(gridSide * gridSide).toFixed(2)} 平方米`);

      }
      calcSide();
    }

    function eagle_single(flag) {
      /********************************************************************
 * 工具：经纬度 ↔ Web Mercator
 ********************************************************************/
      const RAD = Math.PI / 180, R = 6378137;
      function lngLatToM([lng, lat]) {
        const x = R * lng * RAD;
        const y = R * Math.log(Math.tan((90 + lat) * RAD / 2));
        return [x, y];
      }
      function mToLngLat([x, y]) {
        const lng = (x / R) / RAD;
        const lat = (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) / RAD;
        return [lng, lat];
      }
      function polygonArea(ring) {
        let area = 0;
        const n = ring.length;
        for (let i = 0, j = n - 1; i < n; j = i++)
          area += ring[i][0] * ring[j][1] - ring[j][0] * ring[i][1];
        return Math.abs(area) / 2;
      }
      function bbox(ring) {
        let [minX, minY, maxX, maxY] = [Infinity, Infinity, -Infinity, -Infinity];
        ring.forEach(([x, y]) => {
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        });
        return { minX, minY, maxX, maxY };
      }

      /********************************************************************
       * 裁剪：矩形带 vs 多边形（Sutherland-Hodgman）
       ********************************************************************/
      function clipPolyByBand(poly, band) {
        const edges = [
          [[band.xmin, band.ymin], [band.xmin, band.ymax]],
          [[band.xmin, band.ymax], [band.xmax, band.ymax]],
          [[band.xmax, band.ymax], [band.xmax, band.ymin]],
          [[band.xmax, band.ymin], [band.xmin, band.ymin]]
        ];
        return edges.reduce((p, e) => sutherlandHodgman(p, e), poly);
      }
      function sutherlandHodgman(poly, [s, e]) {
        const out = [];
        let prev = poly[poly.length - 1], prevIn = inside(prev, s, e);
        poly.forEach(cur => {
          const curIn = inside(cur, s, e);
          if (curIn) {
            if (!prevIn) out.push(intersect(prev, cur, s, e));
            out.push(cur);
          } else if (prevIn) out.push(intersect(prev, cur, s, e));
          prev = cur; prevIn = curIn;
        });
        return out;
      }
      function inside([x, y], [sx, sy], [ex, ey]) {
        return (ex - sx) * (y - sy) - (ey - sy) * (x - sx) <= 0;
      }
      function intersect([x1, y1], [x2, y2], [sx, sy], [ex, ey]) {
        const denom = (ex - sx) * (y2 - y1) - (ey - sy) * (x2 - x1);
        if (Math.abs(denom) < 1e-10) return [x1, y1];
        const ua = ((ey - sy) * (x1 - sx) - (ex - sx) * (y1 - sy)) / denom;
        return [x1 + ua * (x2 - x1), y1 + ua * (y2 - y1)];
      }

      /********************************************************************
       * 递归分割：面积 > A 时继续平分
       ********************************************************************/
      let kmlFeatures = [];

      function split(poly, maxA, depth = 0) {
        const area = polygonArea(poly);
        if (area <= maxA || depth > 20) { // 深度限制防死循环
          const coords = poly.map(mToLngLat);
          const coordStr = [...coords, coords[0]]
            .map(p => `${p[0]},${p[1]},0`).join(' ');
          kmlFeatures.push(`
      <Placemark>
        <name>Zone_${kmlFeatures.length + 1}</name>
        <Polygon>
          <outerBoundaryIs>
            <LinearRing>
              <coordinates>${coordStr}</coordinates>
            </LinearRing>
          </outerBoundaryIs>
        </Polygon>
      </Placemark>`);
          console.log(coords)

          //绘图
          var points = [];
          for (var i = 0; i < coords.length; i++) {
            console.log(coords[i][0])
            console.log(coords[i][1])

            var p = new BMap.Point(coords[i][0], coords[i][1]);
            points.push(p);

          }
          var curve = new BMap.Polygon(points, { strokeColor: "blue", strokeWeight: 3, strokeOpacity: 0.5 }); //创建弧线对象
          curve.addEventListener("click", function (e) {
            eagle_snake_click(this);
            console.log(this)
          })
          map.addOverlay(curve); //添加到地图中
          overlays.push(curve);
          overlays_split.push(curve);
          return;
        }


        /* 沿长轴一分为二 */
        const { minX, minY, maxX, maxY } = bbox(poly);
        const width = maxX - minX, height = maxY - minY;
        const vertical = height > width;
        const mid = vertical
          ? minY + height / 2
          : minX + width / 2;
        const band1 = vertical
          ? { xmin: minX, xmax: maxX, ymin: minY, ymax: mid }
          : { xmin: minX, xmax: mid, ymin: minY, ymax: maxY };
        const band2 = vertical
          ? { xmin: minX, xmax: maxX, ymin: mid, ymax: maxY }
          : { xmin: mid, xmax: maxX, ymin: minY, ymax: maxY };

        const sub1 = clipPolyByBand(poly, band1);
        const sub2 = clipPolyByBand(poly, band2);
        if (sub1.length) split(sub1, maxA, depth + 1);
        if (sub2.length) split(sub2, maxA, depth + 1);
      }

      /********************************************************************
       * 主入口
       ********************************************************************/
      function splitPoly() {
        // const lines = document.getElementById('polyInput').value.trim().split(/\r?\n/);

        if (maxA <= 0) return alert('面积上限必须 > 0');

        kmlFeatures = [];
        split(poly, maxA);
        console.log(kmlFeatures)
        alert(`共生成 ${kmlFeatures.length} 个子区，全部面积 ≤ ${maxA} m²`);


      }

        console.log(kmlFeatures)
        if (kmlFeatures.length === 0) return alert('请先分割！');
        const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>PolygonSplitSafe</name>
    ${kmlFeatures.join('\n')}
  </Document>
</kml>`;
        const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'polygon_safe.kml';
        a.click();
        URL.revokeObjectURL(url);


      }
      if (flag == 0) {
        splitPoly()
      }
      if (flag == 1) {
        splitPoly()
        downloadKML()
      }
    }
